<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments — GEHU Connect</title>
  <link rel="stylesheet" href="../CSS/global.css" />
  <style>
    /* ── Assignment card ── */
    .asgn-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      padding: 20px 24px;
      margin-bottom: 14px;
      transition: var(--t);
      animation: fadeUp 0.4s ease both;
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-sm);
    }
    .asgn-card:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }

    /* Most-urgent: pulsing red glow */
    .asgn-card.urgent-top {
      border-color: rgba(255,71,87,0.4);
      box-shadow: 0 0 0 0 rgba(255,71,87,0.45);
      animation: fadeUp 0.4s ease both, pulse-ring 2s 0.5s infinite;
    }

    .asgn-rank {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--glass-light);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .asgn-rank.top-rank { background: var(--accent-grad); color: #fff; }

    .asgn-body { flex: 1; min-width: 0; }
    .asgn-subject {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }
    .asgn-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asgn-due { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }

    /* ── Days left badge ── */
    .days-badge {
      flex-shrink: 0;
      text-align: center;
      min-width: 62px;
    }
    .days-num {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
    }
    .days-lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-top: 3px; }
    .days-badge.overdue .days-num  { color: var(--danger); }
    .days-badge.critical .days-num { color: var(--danger); }
    .days-badge.soon .days-num     { color: var(--warning); }
    .days-badge.ok .days-num       { color: var(--success); }

    /* ── Urgent label ── */
    .urgent-label {
      position: absolute;
      top: -10px; left: 20px;
      background: var(--danger);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <a href="student_dashboard.html" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
          <span class="logo-icon">🎓</span>
          <span class="logo-text">GEHU<span class="logo-accent">Connect</span></span>
        </a>
      </div>
      <div class="header-right">
        <div class="student-badge">
          <span id="headerName">—</span>
          <span class="roll-pill" id="headerRoll">—</span>
        </div>
        <a href="student_dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="page-header">
      <div class="page-title">📝 Assignments</div>
      <div class="page-subtitle">Sorted by nearest due date · Min-Heap (Manisha Bisht — 2419475)</div>
    </div>

    <div id="asgnList">
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
        <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto 12px;display:block;"></div>
        Loading assignments…
      </div>
    </div>
  </main>

  <footer class="footer">
    © 2026 GEHU Connect · DSA: Min-Heap (Manisha Bisht — 2419475)
  </footer>

  <script>
    const student = JSON.parse(sessionStorage.getItem('student'));
    if (!student) { window.location.href = 'index.html'; }
    else {
      document.getElementById('headerName').textContent = student.name;
      document.getElementById('headerRoll').textContent = student.id;
    }

    function daysLeft(dueDateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const due   = new Date(dueDateStr);
      return Math.round((due - today) / (1000 * 60 * 60 * 24));
    }

    fetch(`http://localhost:5000/assignments?id=${student.id}`)
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('asgnList');
        list.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = '<div class="empty-state"><span class="empty-icon">🎉</span>No pending assignments!</div>';
          return;
        }

        data.forEach((a, i) => {
          const dl  = daysLeft(a.due_date);
          let dayClass = 'ok';
          let dayText  = `${dl} days`;
          if (dl < 0)       { dayClass = 'overdue';  dayText = 'Overdue!'; }
          else if (dl === 0){ dayClass = 'critical'; dayText = 'Today!'; }
          else if (dl <= 3) { dayClass = 'critical'; }
          else if (dl <= 7) { dayClass = 'soon'; }

          const card = document.createElement('div');
          card.className = `asgn-card${i === 0 ? ' urgent-top' : ''}`;
          card.style.animationDelay = `${i * 0.07}s`;
          card.innerHTML = `
            ${i === 0 ? '<div class="urgent-label">🔥 Most Urgent</div>' : ''}
            <div class="asgn-rank${i === 0 ? ' top-rank' : ''}">${i + 1}</div>
            <div class="asgn-body">
              <div class="asgn-subject">${a.subject}</div>
              <div class="asgn-title">${a.title}</div>
              <div class="asgn-due">📅 Due: ${a.due_date}</div>
            </div>
            <div class="days-badge ${dayClass}">
              <div class="days-num">${dl < 0 ? '⚠' : dl}</div>
              <div class="days-lbl">${dayText}</div>
            </div>
          `;
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('asgnList').innerHTML =
          '<p style="color:var(--danger);text-align:center;padding:40px;">⚠️ Failed to load assignments.</p>';
      });
  </script>

</body>
</html>
