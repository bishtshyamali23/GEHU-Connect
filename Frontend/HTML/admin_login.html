<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — GEHU Connect</title>
  <link rel="stylesheet" href="../CSS/global.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-wrapper { width: 100%; max-width: 400px; animation: fadeUp 0.55s ease both; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-icon { font-size: 3rem; display: block; margin-bottom: 8px; filter: drop-shadow(0 0 14px rgba(255,165,2,0.5)); }
    .brand-name { font-size: 1.6rem; font-weight: 800; }
    .brand-name span { background: linear-gradient(135deg,#ffa502,#ff6b81); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .brand-sub { color: var(--text-muted); font-size: 0.82rem; margin-top: 4px; }
    .err-box { display:none; background:rgba(255,71,87,0.08); border:1px solid rgba(255,71,87,0.25); border-radius:var(--r-sm); padding:11px 14px; font-size:0.86rem; color:var(--danger); margin-top:14px; }
    .err-box.show { display: block; animation: fadeUp 0.25s ease; }
    .back-link { text-align:center; margin-top:18px; font-size:0.82rem; }
    .back-link a { color:var(--text-muted); text-decoration:none; }
    .back-link a:hover { color:var(--text-primary); }
    #loginBtn .spinner { display:none; }
    #loginBtn.loading .spinner { display:inline-block; }
    #loginBtn.loading .btn-text { display:none; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div class="brand-name">GEHU<span>Admin</span></div>
      <div class="brand-sub">Administrative Access · GEHU Connect</div>
    </div>

    <div class="card">
      <div style="font-size:1rem;font-weight:700;margin-bottom:20px;">
        Admin Login
        <span style="display:block;font-size:0.82rem;color:var(--text-muted);font-weight:400;margin-top:3px;">
          Enter your admin credentials
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="admin" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" />
      </div>

      <button class="btn btn-primary btn-full" id="loginBtn" onclick="doAdminLogin()">
        <span class="spinner"></span>
        <span class="btn-text">Login to Admin Panel →</span>
      </button>
      <div class="err-box" id="errBox"></div>
    </div>

    <div class="back-link"><a href="index.html">← Back to Student Login</a></div>
  </div>

  <script>
    async function doAdminLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn      = document.getElementById('loginBtn');
      const err      = document.getElementById('errBox');

      err.classList.remove('show');
      if (!username || !password) {
        err.textContent = 'Please enter both username and password.';
        err.classList.add('show');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res  = await fetch('/api/admin_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin.html';
        } else {
          err.textContent = '❌ ' + (data.error || 'Invalid credentials.');
          err.classList.add('show');
        }
      } catch {
        err.textContent = '⚠️ Cannot connect to server.';
        err.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }
    document.addEventListener('keyup', e => { if (e.key === 'Enter') doAdminLogin(); });
  </script>

</body>
</html>
